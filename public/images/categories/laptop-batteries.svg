<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="batteryBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gaugeGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="batShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="120" cy="148" rx="80" ry="10" fill="#E2E8F0" opacity="0.7" />

  <g filter="url(#batShadow)">
    <!-- Battery Main Pack (Lithium-Ion multi-cell enclosure) -->
    <rect x="35" y="70" width="170" height="58" rx="6" fill="url(#batteryBody)" stroke="#475569" stroke-width="1.2" />

    <!-- Modular Cell Segments Lines -->
    <line x1="75" y1="70" x2="75" y2="128" stroke="#1E293B" stroke-width="1.5" />
    <line x1="115" y1="70" x2="115" y2="128" stroke="#1E293B" stroke-width="1.5" />
    <line x1="155" y1="70" x2="155" y2="128" stroke="#1E293B" stroke-width="1.5" />

    <!-- Gold Brass Connector Interface -->
    <rect x="85" y="60" width="70" height="11" rx="2" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <rect x="92" y="63" width="6" height="5" fill="#EAB308" />
    <rect x="102" y="63" width="6" height="5" fill="#EAB308" />
    <rect x="112" y="63" width="6" height="5" fill="#EAB308" />
    <rect x="122" y="63" width="6" height="5" fill="#EAB308" />
    <rect x="132" y="63" width="6" height="5" fill="#EAB308" />
    <rect x="142" y="63" width="6" height="5" fill="#EAB308" />

    <!-- Certification & Spec Label -->
    <rect x="45" y="80" width="60" height="38" rx="3" fill="#FFFFFF" />
    <text x="49" y="90" font-family="sans-serif" font-size="6" font-weight="bold" fill="#0F172A">ORIGINAL OEM</text>
    <text x="49" y="98" font-family="sans-serif" font-size="5" font-weight="normal" fill="#64748B">Li-ion 11.4V • 56Wh</text>
    <text x="49" y="106" font-family="sans-serif" font-size="5" font-weight="normal" fill="#64748B">Grade A Cells • CE/FC</text>
    <text x="49" y="114" font-family="sans-serif" font-size="5" font-weight="bold" fill="#FFB200">GTC VERIFIED</text>

    <!-- Battery Health Gauge Display -->
    <rect x="125" y="86" width="65" height="14" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <rect x="128" y="89" width="48" height="8" rx="2" fill="url(#gaugeGreen)" />
    <!-- Battery positive terminal nub -->
    <rect x="190" y="91" width="3" height="4" rx="1" fill="#64748B" />

    <!-- 100% Health Status -->
    <text x="125" y="112" font-family="sans-serif" font-size="6" font-weight="bold" fill="#10B981">100% HEALTH • 0 CYCLES</text>
  </g>
</svg>
