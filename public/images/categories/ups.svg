<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="upsBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="lcdScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <filter id="upsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="120" cy="160" rx="60" ry="10" fill="#E2E8F0" opacity="0.7" />

  <g filter="url(#upsShadow)">
    <!-- Tower Body (Perspective Mini-Tower) -->
    <rect x="75" y="30" width="90" height="125" rx="8" fill="url(#upsBody)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Top Bevel -->
    <path d="M75 42 Q75 30 87 30 L153 30 Q165 30 165 42 Z" fill="#1E293B" />

    <!-- Circular Power On/Off Button -->
    <circle cx="120" cy="52" r="9" fill="#0F172A" stroke="#475569" stroke-width="1.5" />
    <path d="M120 47 L120 52" stroke="#FFB200" stroke-width="2" stroke-linecap="round" />
    <path d="M115 50 A6 6 0 1 0 125 50" fill="none" stroke="#FFB200" stroke-width="2" stroke-linecap="round" />

    <!-- Digital LCD Status Display (Pure Sine Wave & Voltage) -->
    <rect x="88" y="70" width="64" height="42" rx="4" fill="url(#lcdScreen)" stroke="#047857" stroke-width="1.2" />
    
    <!-- LCD Screen Details -->
    <text x="120" y="82" font-family="monospace" font-size="9" font-weight="bold" fill="#34D399" text-anchor="middle">230V IN</text>
    <text x="120" y="93" font-family="monospace" font-size="8" font-weight="bold" fill="#10B981" text-anchor="middle">~ PURE SINE</text>
    <!-- Battery Level Bar on LCD -->
    <rect x="94" y="98" width="52" height="7" rx="1.5" fill="#064E3B" stroke="#34D399" stroke-width="0.8" />
    <rect x="96" y="100" width="40" height="3" rx="1" fill="#34D399" />

    <!-- Front Ventilation Grille Slots -->
    <rect x="88" y="122" width="64" height="2" rx="1" fill="#0F172A" />
    <rect x="88" y="128" width="64" height="2" rx="1" fill="#0F172A" />
    <rect x="88" y="134" width="64" height="2" rx="1" fill="#0F172A" />
    <rect x="88" y="140" width="64" height="2" rx="1" fill="#0F172A" />

    <!-- Brand Label -->
    <text x="120" y="149" font-family="sans-serif" font-size="6" font-weight="bold" fill="#94A3B8" text-anchor="middle" letter-spacing="1">1500VA PRO</text>
  </g>
</svg>
