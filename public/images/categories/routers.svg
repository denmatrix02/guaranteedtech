<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="routerBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="routerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="120" cy="155" rx="80" ry="12" fill="#E2E8F0" opacity="0.7" />

  <g filter="url(#routerShadow)">
    <!-- 4 High-Gain Antennas -->
    <!-- Far Left Antenna -->
    <path d="M55 95 L30 25 Q32 20 37 22 L62 95 Z" fill="#1E293B" stroke="#475569" stroke-width="1" />
    <!-- Center Left Antenna -->
    <path d="M85 90 L75 15 Q80 12 85 15 L95 90 Z" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <!-- Center Right Antenna -->
    <path d="M145 90 L155 15 Q160 12 165 15 L155 90 Z" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <!-- Far Right Antenna -->
    <path d="M185 95 L210 25 Q208 20 203 22 L178 95 Z" fill="#1E293B" stroke="#475569" stroke-width="1" />

    <!-- Sleek Stealth Router Chassis -->
    <polygon points="40,120 70,85 170,85 200,120 185,142 55,142" fill="url(#routerBody)" stroke="#475569" stroke-width="1.2" />

    <!-- Top Aerodynamic Fin & Heat Vents -->
    <polygon points="80,88 120,80 160,88 155,100 85,100" fill="#1E293B" />
    <line x1="90" y1="94" x2="150" y2="94" stroke="#FFB200" stroke-width="1" />

    <!-- Front Status LED Array (Wi-Fi 6, WAN, LAN, Power) -->
    <circle cx="85" cy="130" r="2.5" fill="#10B981" />
    <circle cx="95" cy="130" r="2.5" fill="#3B82F6" />
    <circle cx="105" cy="130" r="2.5" fill="#3B82F6" />
    <circle cx="115" cy="130" r="2.5" fill="#3B82F6" />
    <circle cx="125" cy="130" r="2.5" fill="#3B82F6" />
    <circle cx="135" cy="130" r="2.5" fill="#FFB200" />
    <circle cx="145" cy="130" r="2.5" fill="#10B981" />

    <!-- Wi-Fi 6 Gigabit Badge -->
    <rect x="98" y="106" width="44" height="12" rx="3" fill="#0F172A" stroke="#334155" stroke-width="0.8" />
    <text x="120" y="115" font-family="sans-serif" font-size="6" font-weight="bold" fill="#FFB200" text-anchor="middle">Wi-Fi 6 AX</text>
  </g>
</svg>
