<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="100%" height="100%">
  <defs>
    <linearGradient id="posScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="scannerRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0" />
    </linearGradient>
    <filter id="posShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="120" cy="155" rx="85" ry="12" fill="#E2E8F0" opacity="0.7" />

  <g filter="url(#posShadow)">
    <!-- Metal Heavy-Duty Cash Drawer Base -->
    <rect x="40" y="125" width="160" height="26" rx="4" fill="#1E293B" stroke="#334155" stroke-width="1.2" />
    <!-- Drawer Lock & Slot -->
    <circle cx="55" cy="138" r="4" fill="#94A3B8" stroke="#475569" stroke-width="1" />
    <rect x="75" y="136" width="60" height="4" rx="1" fill="#0F172A" />

    <!-- Angled POS Terminal Stand -->
    <polygon points="105,125 135,125 128,75 112,75" fill="#475569" />

    <!-- Touchscreen Terminal Bezel (Angled) -->
    <rect x="65" y="32" width="110" height="72" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <!-- Active Glass Screen -->
    <rect x="70" y="37" width="100" height="62" rx="4" fill="url(#posScreen)" />

    <!-- UI Screen Content (Retail Dashboard mockup) -->
    <rect x="74" y="42" width="92" height="12" rx="2" fill="#3B82F6" />
    <text x="120" y="50" font-family="sans-serif" font-size="6" font-weight="bold" fill="#FFFFFF" text-anchor="middle">RETAIL CHECKOUT</text>
    
    <!-- Item Line Mockup -->
    <rect x="74" y="58" width="55" height="5" rx="1" fill="#334155" />
    <rect x="74" y="66" width="45" height="5" rx="1" fill="#334155" />
    <text x="156" y="62" font-family="sans-serif" font-size="6" font-weight="bold" fill="#10B981" text-anchor="end">₦ 85,000</text>
    <!-- Pay Button -->
    <rect x="74" y="80" width="92" height="14" rx="3" fill="#FFB200" />
    <text x="120" y="89" font-family="sans-serif" font-size="6" font-weight="bold" fill="#0F172A" text-anchor="middle">COMPLETE PAYMENT</text>

    <!-- Handheld Barcode Scanner Beside (Right Side) -->
    <g transform="translate(182, 75) rotate(15)">
      <!-- Gun Body -->
      <path d="M0 0 L25 -10 L30 15 L20 18 L12 40 L0 38 L6 18 Z" fill="#334155" stroke="#1E293B" stroke-width="1.2" />
      <polygon points="23,-8 28,12 32,10 27,-9" fill="#FFB200" />
      <!-- Red Scan Beam -->
      <polygon points="28,-6 20,-30 40,-25 31,10" fill="url(#scannerRed)" opacity="0.6" />
    </g>
  </g>
</svg>
